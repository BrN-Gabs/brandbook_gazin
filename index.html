<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080EA0" />
    <link rel="preload" as="image" href="./assets/logo-gazin.png" fetchpriority="high" />
    <style>html { background: #050B2F; } /* --gazin-navy, before CSS loads */</style>
    <script>
      // Before any module (GSAP's ScrollTrigger captures this value at load): a reload
      // always restarts at the top of the home, never at the restored scroll offset.
      try {
        history.scrollRestoration = 'manual'
        var entry = performance.getEntriesByType('navigation')[0]
        if (entry && entry.type === 'reload' && location.hash) history.replaceState(history.state, '', location.pathname + location.search)
      } catch (error) { /* Older engines simply keep their default. */ }
    </script>
    <link rel="icon" type="image/png" href="/assets/logo-gazin.png" />
    <meta name="description" content="Manual da Marca Gazin. Nossa essência, missão, visão e os pilares que orientam um jeito de fazer, conectar e transformar." />
    <title>Manual da Marca Gazin</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
